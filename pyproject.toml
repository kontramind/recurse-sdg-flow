[project]
name = "recurse-sdg-flow"
version = "0.1.0"
description = "Recursive synthetic data generation pipeline"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Pinned to match sdpype's currently-installed versions, to keep the
    # Step 2 parity test (diffing against ../rd-lake/Step7/...) deterministic.
    "pandas==2.3.3",
    "numpy==1.26.4",
    "scikit-learn==1.7.2",
    "openpyxl>=3.1.0",
    "pyyaml>=6.0",
    # Step 3 — TRTR baseline (LightGBM + Optuna), also pinned exact
    "prefect==3.6.24",
    "lightgbm==4.5.0",
    "optuna==4.6.0",
    "betacal==1.1.0",
    "plotly==5.24.1",
    "kaleido==0.2.1",
    # Prefect's transitive web-server stack — pinned exact too, since a newer
    # fastapi/starlette combo breaks Prefect's embedded ephemeral server
    # (AttributeError: 'PrefectRouter' object has no attribute 'routes')
    "fastapi==0.135.2",
    "starlette==1.0.0",
    "pydantic==2.12.5",
    # Step 4 — encode stage (RDT dataset encoding), pinned exact
    "rdt==1.18.2",
    # rdt's own transitive deps that drifted from sdpype's exact versions —
    # scipy matters because rdt's UniformEncoder/FloatFormatter use
    # scipy.stats internally, directly in the byte-exact-verified encode path
    "scipy==1.13.1",
    "Faker==38.2.0",
    # Step 4 — train/generate stages (synthcity-backed generators: arf,
    # ctgan, ddpm, rtvae, nflow). Pinned exact to sdpype's installed
    # versions — this GPU/torch stack took real effort to get working
    # together on this machine's CUDA 12.8 Blackwell GPU, must not drift.
    "synthcity==0.2.12",
    "torch==2.9.1",
    "torchvision==0.24.1",
    "torchaudio==2.9.1",
    "opacus==1.4.1",
    # Step 5 — evaluation stages. sdpype's eval code uses the real
    # sdv.metadata.SingleTableMetadata (load_from_json / .columns / .to_dict);
    # adding the real package rather than a shim keeps the metadata bytes fed
    # to sdmetrics/synthcity/k-anon identical to production, and leaves the
    # door open to SDV-backed generators/metrics later. sdv also pulls
    # sdmetrics (needed for the statistical stage) + copulas/ctgan/graphviz/
    # boto3 — transitive drift on the numerically-sensitive set is pinned via
    # constraint-dependencies below (same lock-diff procedure as Steps 3-4).
    "sdv==1.30.0",
    # sdv's loose bounds resolve sdmetrics 0.30.0; sdpype has 0.28.0 and the
    # statistical stage reaches into sdmetrics' private
    # reports.single_table._properties API (SpearmanColumnPairTrends), so pin
    # it directly to sdpype's version.
    "sdmetrics==0.28.0",
    # Step 5 — statistical_similarity stage. Two eval-only backends used by
    # sdpype/evaluation/statistical.py:
    #   syndat   -> jensenshannon_syndat  (syndat.metrics.jensen_shannon_distance)
    #   geomloss -> wasserstein_distance  (geomloss.SamplesLoss, Sinkhorn OT)
    # geomloss is already pulled transitively by synthcity but resolves 0.3.1
    # here vs sdpype's 0.2.6 — pin it back. syndat is new; it drags a plotting/
    # explainability tail (matplotlib/seaborn/plotnine/shap) that is off the
    # JSD compute path. nannyml is deliberately NOT added: JensenShannonNannyMLMetric
    # is np.histogram + scipy.spatial.distance.jensenshannon only despite its
    # name, and the module-level `from nannyml...` import is dead code (dropped
    # in the port).
    "syndat==0.13.6",
    "geomloss==0.2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sdg_core"]

# UV TOOL CONFIGURATION for CUDA 12.8 support, copied from sdpype/pyproject.toml.
[tool.uv]
# Force this exact PyTorch build despite synthcity (or other dependencies)
# potentially requiring torch<2.3. Tightened to exact versions here (sdpype's
# own block uses loose >= bounds) to match this project's exact-pin
# philosophy and stop a future `uv lock --upgrade` from silently drifting.
override-dependencies = [
    "torch==2.9.1",
    "torchvision==0.24.1",
    "torchaudio==2.9.1",
]
constraint-dependencies = [
    "numpy<2.0",
    "scipy<1.14",
    "opacus<1.5.0",
    # sdv's transitive deps drift newer than sdpype's installed versions.
    # copulas is numerically load-bearing (sdmetrics' correlation / quality
    # computations); ctgan/deepecho are unused SDV synthesizers but hard sdv
    # deps — pinned to sdpype's versions for parity. Infra churn
    # (boto3/botocore/platformdirs/s3transfer/jmespath) left as-is: not on any
    # computation path.
    "copulas==0.12.3",
    "ctgan==0.11.1",
    "deepecho==0.7.0",
]

# Kept for parity with sdpype's pyproject.toml, but verified inert: sdpype's
# own uv.lock resolves torch/torchvision/torchaudio from plain PyPI
# (source = "https://pypi.org/simple"), not this index — no [tool.uv.sources]
# entry routes to it. Today's PyPI wheel for torch==2.9.1 on Linux/x86_64
# happens to be the cu128 build already. Don't rely on this block for CUDA
# support — verify with `torch.cuda.is_available()` after `uv sync` instead.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
